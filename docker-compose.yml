version: '3.8'

services:
  svelte-app:
    build: .
    container_name: svelte_league_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Add any additional .env variables here, or use `env_file: .env`
    # We do NOT expose ports to the host here. 
    # Nginx will handle external traffic and route it internally to port 3000.

  nginx:
    image: nginx:alpine
    container_name: league_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443" # Uncomment when adding SSL certificates later
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - svelte-app

  cron-sidecar:
    image: alpine:latest
    container_name: league_cron_scheduler
    restart: unless-stopped
    depends_on:
      - svelte-app
    # Sets up the daily 06:00 cron job natively in Alpine and starts the daemon in foreground.
    # It communicates directly with the svelte-app container over Docker's internal DNS.
    command: >
      /bin/sh -c "echo '0 6 * * * wget -qO- http://svelte-app:3000/api/fetch_player_pick_values > /dev/null 2>&1' > /etc/crontabs/root && crond -f -d 8"
