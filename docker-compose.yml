services:
  league-page:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: league-page-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - ROSTER_AUDIT_API_KEY=${ROSTER_AUDIT_API_KEY}


